<script>
'use strict';
/* ---------- Physics (fixed 60 Hz step) ---------- */
const LW = 380, LH = 490, DANGER_Y = 88, DROP_Y = 50;
// A wide range, like real marbles: the smallest is a pea beside the largest.
const RADII = [12, 17, 23, 30, 38, 47, 57, 68, 80, 93];
const VALUES = RADII.map((_, i) => 2 ** (i + 1));          // 2 … 1024; two 1024s bloom into 2048
const BLOOM_VALUE = 2048, WILD_R = 22;
// Glass on wood: a little bounce, and marbles that keep rolling until something stops them. (v5's feel.)

// How freely a sphere can move in direction (dx, dy): against the floor it can only slide sideways, against a wall only up or down.
function give(b, dx, dy) {

  if ((dx < 0 && b.x <= b.radius + 4.5) || (dx > 0 && b.x >= LW - b.radius - 4.5)) f = Math.min(f, dy * dy);

// wind pushes falling spheres (per frame², for a sphere of radius 30; small ones drift more, within reason).
// Returns the merges (with the new sphere's id) and blooms, and whether anything touched down.
function stepWorld(world, wind) {
  const events = [], dt = 1 / PHYS.sub;
  let balls = world.balls, landed = false;
  const touchDown = (b) => { if (!b.landed) { b.landed = true; landed = true; } };
  for (let s = 0; s < PHYS.sub; s++) {
    const pairs = [];
    for (const b of balls) {
      b.vy += PHYS.gravity * dt;
      if (wind && !b.landed) b.vx += wind * (30 / Math.max(20, b.radius)) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.angle += b.omega * dt;

    }

        const canMerge = a.wild || b.wild || a.tier === b.tier;   // a Dewdrop merges with anything, another Dewdrop included
