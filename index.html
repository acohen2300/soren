<script>

/* ---------- Physics (fixed 60 Hz step) ---------- */
const LW = 380, LH = 490, DANGER_Y = 88, DROP_Y = 50;
// A wide range, like real marbles: the smallest is a pea beside the largest.
const RADII = [12, 17, 23, 30, 38, 47, 57, 68, 80, 93];
const VALUES = RADII.map((_, i) => 2 ** (i + 1));          // 2 … 1024; two 1024s bloom into 2048
const BLOOM_VALUE = 2048, WILD_R = 22;
// Glass on wood: a little bounce, and marbles that keep rolling until something stops them. (v5's feel.)
const PHYS = { gravity: 0.40, air: 0.9985, rest: 0.14, roll: 0.994, friction: 0.22, wall: 0.3, floor: 0.12, sub: 8 };

function createWorld() { return { balls: [], nextId: 1 }; }
// How freely a sphere can move in direction (dx, dy): against the floor it can only slide sideways, against a wall only up or down.
function give(b, dx, dy) {
  let f = 1;
  if (dy > 0 && b.y >= LH - b.radius - 6.5) f = Math.min(f, dx * dx);
  if ((dx < 0 && b.x <= b.radius + 4.5) || (dx > 0 && b.x >= LW - b.radius - 4.5)) f = Math.min(f, dy * dy);
  return f;
}

  const radius = o.wild ? WILD_R : RADII[tier], mass = radius * radius, inertia = 0.5 * mass * radius * radius;
  const b = { id: world.nextId++, x, y, vx: o.vx || 0, vy: o.vy || 0, radius, mass, invMass: 1 / mass, inertia, invInertia: 1 / inertia,
    tier, wild: !!o.wild, angle: o.angle || 0, omega: o.omega || 0, age: o.age || 0, merged: false, landed: !!o.landed };
  world.balls.push(b);
  return b;
}
// wind pushes falling spheres (per frame², for a sphere of radius 30; small ones drift more, within reason).
// Returns the merges (with the new sphere's id) and blooms, and whether anything touched down.
function stepWorld(world, wind) {
  const events = [], dt = 1 / PHYS.sub;
  let balls = world.balls, landed = false;
  const touchDown = (b) => { if (!b.landed) { b.landed = true; landed = true; } };
  for (let s = 0; s < PHYS.sub; s++) {
    const pairs = [];
    for (const b of balls) {
      b.vy += PHYS.gravity * dt;
      if (wind && !b.landed) b.vx += wind * (30 / Math.max(20, b.radius)) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.angle += b.omega * dt;
      const L = b.radius + 4, R = LW - b.radius - 4, F = LH - b.radius - 6;
      // Walls and floor grip: a marble sliding along one picks up spin and settles into a true roll.
      if (b.x < L) { b.x = L; if (b.vx < 0) b.vx = -b.vx * PHYS.wall; b.omega += ((b.vy - b.omega * b.radius) / b.radius) * 0.12 * dt; }
      else if (b.x > R) { b.x = R; if (b.vx > 0) b.vx = -b.vx * PHYS.wall; b.omega -= ((b.vy + b.omega * b.radius) / b.radius) * 0.12 * dt; }
      if (b.y > F) {

    }

        if (a.merged || b.merged) continue;
        const dx = b.x - a.x, dy = b.y - a.y, distSq = dx * dx + dy * dy, minDist = a.radius + b.radius;
        const canMerge = a.wild || b.wild || a.tier === b.tier;   // a Dewdrop merges with anything, another Dewdrop included
        if (canMerge && distSq < (minDist + 7) ** 2 && distSq > 0.001) {   // a pair that can merge draws together

        const rvx = (b.vx + b.omega * b.radius * ny) - (a.vx - a.omega * a.radius * ny);

    // It stays free to slide along it, so a small sphere squeezed under a big one squirts out sideways like a real marble.
    for (const b of balls) {

      if (b.x < L) { b.x = L; if (b.vx < 0) b.vx = 0; } else if (b.x > R) { b.x = R; if (b.vx > 0) b.vx = 0; }
      if (b.y > F) { b.y = F; if (b.vy > 0) b.vy = 0; }
    }

    if (pairs.length) {
      world.balls = balls = balls.filter(b => !b.merged);
      for (const [a, b] of pairs) {
        const base = a.wild ? b.tier : a.tier, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
        if (base >= RADII.length - 1) { events.push({ type: 'bloom', x, y }); continue; }

        const nb = addBall(world, x, y, tier, { vx: (a.vx * a.mass + b.vx * b.mass) / m, vy: (a.vy * a.mass + b.vy * b.mass) / m,

        nb.hot = true;
        events.push({ type: 'merge', id: nb.id, tier, x, y });
      }
    }
  }
  for (const b of balls) { b.vx *= PHYS.air; b.vy *= PHYS.air; b.omega *= PHYS.air; b.age += 1; }
  return { events, landed };
}

/* ---------- Helpers ---------- */
const TAU = Math.PI * 2;

    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); S.targetX = clamp(S.targetX + (e.key === 'ArrowLeft' ? -14 : 14), 10, LW - 10); }
  });

  bindWheels();
  // One listener for every setting, card, bar cell and action, wherever it was built.
  const ACTS = { still: () => setStill(!S.still), sure: () => { S.sure = true; redraw('.pausebig', 'pauseBig'); }, newpool: restart, deep: () => { closeSheet(); startSigh(); }, minute: oneMinute,
    goalstop: () => { stopPlan(); closeSheet(); }, ok: () => { keep(); closePanel(); if (S.sleep) $('sleepView').classList.add('idle'); },   // ✓: keep; in Rest the controls then fade
    leaverest: () => { undo(); setMode('play'); } };   // Rest's ✕: put back, and leave
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (PEND.eat) { PEND.eat = false; return; }
    if (S.aiming && t.closest('.bar')) return;   // the pool always wins
    if (S.sure && !t.closest('[data-act=newpool]')) { S.sure = false; redraw('.pausebig', 'pauseBig'); }   // Are you sure? Anything but ✓ is no
    const act = t.closest('[data-act]'); if (act) { ACTS[act.dataset.act](act); return; }
    if (t.closest('#goalCheck')) { if (goalTyped()) keep(); else checkGoal(); syncControls(); return; }   // ✓ keeps a written goal; a kept one it checks off
    const wi = t.closest('.wi'); if (wi) { wheelTap(wi); return; }
    const el = t.closest('[data-el]'); if (el) { edit(el); toggleEl(el.dataset.el); return; }
    const pl = t.closest('[data-place]'); if (pl) { edit(pl); choose('place', pl.dataset.place); return; }
    const ru = t.closest('[data-rule]'); if (ru) { edit(ru); choose('overflow', ru.dataset.rule); return; }
    const hw = t.closest('[data-how]'); if (hw) { edit(hw); choose('leave.how', hw.dataset.how); return; }
    const oo = t.closest('[data-onoff]'); if (oo) { edit(oo); setPref(oo.dataset.onoff, oo.dataset.v === '1'); return; }
    if (t.closest('#sheetMute')) { setPref('sound', !PREFS.sound); return; }
    const s = t.closest('[data-type="switch"]'); if (s) { edit(s); setPref(s.dataset.key, !getPref(s.dataset.key)); return; }
    const sh = t.closest('[data-sheet]'); if (sh) { openSheet(sh.dataset.sheet, true); return; }
    const cell = t.closest('#topBar [data-cell]'); if (cell) { topTap(cell); return; }
    const sky = t.closest('#botBar [data-sky]'); if (sky) { cellTap(sky.dataset.sky); return; }
    const tool = t.closest('[data-tool]'); if (tool) { useTool(tool.dataset.tool); syncBars(); return; }
    const way = t.closest('#botBar [data-way]'); if (way) { setPref('way', way.dataset.way); return; }
    const vw = t.closest('[data-view]'); if (vw) setMode(vw.dataset.view);
  });
  document.addEventListener('input', (e) => {
    const r = e.target.closest('[data-type="range"]'); if (r) { edit(r); fillRange(r); setPref(r.dataset.key, +r.value); return; }
    const tx = e.target.closest('[data-type="text"]'); if (tx) { edit(tx); PREFS[tx.dataset.key] = tx.value.slice(0, 60); showCheck(); }   // a goal you type waits for ✓ too
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.sheet) backSheet(); else closePanel(); }
    else if (e.key === 'Enter' && e.target.matches && e.target.matches('.text-input')) e.target.blur();
  });
  $('sheetDone').addEventListener('click', doneSheet);
  $('goView').addEventListener('click', goReturn);
  $('cardInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('cardA').click(); });
  $('sheetBack').addEventListener('click', backSheet);
  $('sheetHelp').addEventListener('click', () => openSheet('help', true));
  $('scrim').addEventListener('click', backSheet);   // a touch outside the card puts it back, like ✕
  for (const k of ['a', 'b', 'c']) $('card' + k.toUpperCase()).addEventListener('click', () => { hideCard(); if (cardActions[k]) cardActions[k](); });
  $('sleepView').addEventListener('pointerdown', () => { if (S.sleep) { S.sleep.idle = 0; $('sleepView').classList.remove('idle'); } }, true);
  const flush = () => { savePrefs(); saveJournal(); savePool(); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { S.held = true; S.aiming = false; flush(); return; }   // the pool waits for a tap when you come back
    updateWarmth();
    if (S.mode === 'rest') requestWake(true);
    if (S.goal && (S.goal.phase === 'done' || Date.now() >= S.goal.end)) goalBack();   // back after your time: the timer is off, the pool as you left it
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('resize', setupDPI);
}
function setupDPI() {
  const dpr = poolDPR();
  canvas.width = Math.round(LW * dpr); canvas.height = Math.round(LH * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!PEND.els) BAR.key = {};   // the bars rebuild at the new size (not while a cell waits for ✓)
  makeSprites(); if ($('topBar')) syncBars();
}
// The opening: on dark blue, Settle's breath shape takes one breath, circle to the pool's edge and back, then rests as a circle:
// SoRen shimmers in it, the tagline comes under it, and Start. A tap (any time) fades the app in around it.
function opening() {
  if (reduceMotion) return;
  S.intro = { t: 0, len: breathLen(), go: null }; document.body.classList.add('intro');
  for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, introGo, { capture: true, once: true });
}
function introGo() { for (const ev of ['pointerdown', 'keydown']) document.removeEventListener(ev, introGo, true); if (S.intro && S.intro.go == null) { S.intro.go = S.intro.t; document.body.classList.remove('intro'); } }
function start() {
  canvas = $('game'); ctx = canvas.getContext('2d'); S.lastInput = performance.now();
  feel(); bind(); newWorld(true); setupDPI();
  if (!loadPool()) newPool();
  fillItems($('sleepPanel'), SLEEP_ITEMS);
  $('tools').innerHTML = TOOLS.map(t => `<button class="cell" data-tool="${t.id}" aria-label="${t.name}. ${t.desc}">${svg(t.icon)}<span class="sub">${t.name}</span><b class="n"></b></button>`).join('');
  // Every launch, your time comes second, right after Start: ✓ plays with those times, ✕ stays where you were.
  S.mode = PREFS.mode = PREFS.mode === 'rest' ? 'play' : PREFS.mode;
  if (S.mode === 'settle') openSpace();
  $('app').dataset.mode = S.mode; document.body.classList.toggle('settle', S.mode === 'settle');
  S.ballFade = has('spheres') ? 1 : 0; S.held = true; S.wxState = Math.round(PREFS.wx) % 5;   // your cells as you left them
  updateScene(0); updateWind(0); updateWarmth(); syncControls();
  openSheet('checkin');
  opening();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
</script>
