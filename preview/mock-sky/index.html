  ['What is the Journey?', 'Three steps. Settle: the circle, at dusk. Go: plan up to three things to do and how long to play first, then play; when the time is up (or when you touch Go now), go and do them. Return: tick what you did, at dawn. Then Free Play is yours. Free Play at the door skips it all.'],

    const lv = e.target.closest('[data-lvl]'); if (lv) { const i = +lv.dataset.lvl, r = CARD.rows[i].lvl || CARD.rows[i]; engageRow(i); r.set(+lv.value); if (r.clock) { PREFS.byClock = false; savePrefs(); } syncCard(); return; }
    const tx = e.target.closest('[data-task]'); if (tx) { const i = +tx.dataset.task, d = CARD.rows[+tx.closest('[data-row]').dataset.row]; PREFS.tasks[i] = { text: tx.value.slice(0, 60) }; savePrefs(); syncCard(); if (d && d.typed) d.typed(); }   // the first letter: the ritual's second step
  });
  document.addEventListener('change', (e) => {   // a stop time settled: the slider follows it
    const du = e.target.closest('.due'); if (!du || !du.value) return; const [h, m] = du.value.split(':').map(Number);
    PREFS.mins = clamp((h * 60 + m - nowMins() + 1440) % 1440, 3, 96); PREFS.byClock = true; savePrefs(); syncCard();
  });

  document.addEventListener('focusin', (e) => { const r = e.target.closest && e.target.closest('[data-row]'); if (!r) return; engageRow(+r.dataset.row); const d = CARD.rows[+r.dataset.row]; if (d && d.focus && e.target.matches('.tx')) d.focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && POP.alone) { POP.alone = false; $('mcPop').hidden = true; $('mc').classList.remove('alone'); if (!CARD.name) $('mc').hidden = true; syncBars(); return; }   // the frame's own pop-up: Escape is Back
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.tx')) { const d = CARD.rows[+e.target.closest('[data-row]').dataset.row]; if (d && d.confirm) d.confirm(); else e.target.blur(); return; }
    if (!CARD.name) return;
    if (e.key === 'Escape') footAct('close');
    else if (e.target.matches && e.target.matches('input')) return;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); engageRow(nextRow(CARD.i, e.key === 'ArrowDown' ? 1 : -1)); }
    else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && CARD.rows[CARD.i] && CARD.rows[CARD.i].opts) { e.preventDefault(); const r = CARD.rows[CARD.i], k = r.opts.findIndex(([o]) => String(o) === String(r.get())); r.set(r.opts[clamp(k + (e.key === 'ArrowLeft' ? -1 : 1), 0, r.opts.length - 1)][0]); syncCard(); }
  });
  const flush = () => { savePrefs(); saveJournal(); savePool(); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { $('veil').classList.add('on'); S.hadDrone = !!sound.drone; sound.off(); S.awayAt = Date.now(); if (S.mode !== 'rest' && !S.intro) setPaused(true); flush(); return; }   // everything waits for a tap, your time too; the phone's snapshot is dark
    requestAnimationFrame(() => requestAnimationFrame(() => $('veil').classList.remove('on')));
    if (S.awayAt && Date.now() - S.awayAt > 300000) welcomeSoon();   // back after five minutes or more: the breeze again
    if (S.hadDrone) { sound.init(); if (sound.live) sound.startDrone(); }   // the engine was closed while away: the drone that was playing comes back with it
    updateWarmth(); syncBars(); if (S.mode === 'rest') requestWake(true);
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('resize', () => { setupDPI(); fitPool(); BAR.ctlKey = ''; syncBars(); if (CARD.name || POP.alone) fitCard(); });
}
function setupDPI() { const dpr = poolDPR(); canvas.width = Math.round(LW * dpr); canvas.height = Math.round(LH * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); makeSprites(); }
// The slider's handle: a blue ring round white, with ‹ › (or, on the rail, up and down).
function handles() {
  const h = (d) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><circle cx='28' cy='28' r='28' fill='rgb(${BLUE})'/><circle cx='28' cy='28' r='22' fill='rgb(246,247,248)'/><path d='${d}' fill='none' stroke='rgb(28,32,38)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>`)}")`;
  document.documentElement.style.setProperty('--handle', h('M25 19 16 28 25 37M31 19 40 28 31 37'));
  document.documentElement.style.setProperty('--handle-v', h('M19 25 28 16 37 25M19 31 28 40 37 31'));
}

/* ---------- Settle: the opening ---------- */
// On dark blue, the breath's own shape heaves in, flashes once, and falls to the circle with SoRen in it, which goes on
// breathing: three breaths, then Start. A tap anywhere finishes the movement at once. With Reduce motion it is simply there.
function opening() {
  const len = 5.2;   // from the outline's first light to the circle at rest
  hideCard(); closeSheet(); setPaused(false); S.outro = null;
  S.intro = { t: lessMo() ? len + 3 : 0, len, go: null, rest: lessMo(), ready: lessMo(), eng: null, quick: false };
  document.body.classList.add('intro'); syncBars();
}
function introSkip() { const o = S.intro; if (o && o.go == null && o.t < o.len + 3) { o.t = o.len + 3; o.rest = o.ready = o.quick = true; syncBars(); } }   // a tap anywhere brings it all in at once
function introLeave(mode, zen = false) {   // out of the opening and into a mode; a new game lets the last one go
  introGo(); S.prev = null; S.goal = null; setMode(mode); setPaused(false); if (zen) Object.assign(S, { zen: true, fair: false }); syncUI(); welcomeSoon();
}
function introGo() { if (S.intro && S.intro.go == null) { S.intro.go = S.intro.t; S.intro.rest = S.intro.ready = false; document.body.classList.remove('intro', 'intro-two'); DOOR.key = ''; syncBars(); } }
function start() {
  canvas = $('game'); ctx = canvas.getContext('2d'); S.lastInput = performance.now();
  handles(); bind(); newWorld(true); setupDPI();
  const prev = loadJSON(SKEY); S.prev = Array.isArray(prev.balls) && prev.balls.length && !prev.gameOver ? prev : null;   // every launch is a new game; one not lost waits at the door (Play or Start) until the first drop Game
  newPool(); PREFS.mode = 'play'; S.tod = PREFS.hour === 'live' ? clockTod() : HOURS[PREFS.hour];
  updateScene(0); updateWind(0); updateWarmth(); syncUI();
  opening();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
</script>
