/* One screen that never scrolls, on one sky. The bar above the pool, the pool of liquid glass, and under it one row of tiles (the

   settings). A row of work appears above that one only when something is being chosen or adjusted. Every tile is its own glass:
   navy at 15% by day, white frost at 15% by night (72-sky.js sets --tile by the sky), 35% for the one you are on; no outlines; the
   ink is white always. Every size is in mock-up pixels: --u is one of them (the mock-ups are 1206 wide). Green is on (and has a

}

/* ---------- Helpers ---------- */
const TAU = Math.PI * 2;

  window.addEventListener('resize', () => { setupDPI(); fitPool(); BAR.ctlKey = ''; BAR.rows = ''; syncBars(); if (CARD.name || POP.alone) fitCard(); });
}
function setupDPI() { const dpr = poolDPR(); canvas.width = Math.round(LW * dpr); canvas.height = Math.round(LH * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); makeSprites(); }
// The slider's handle: a blue ring round white, with ‹ ›.
function handles() {
  const h = (d) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><circle cx='28' cy='28' r='28' fill='rgb(${BLUE})'/><circle cx='28' cy='28' r='22' fill='rgb(246,247,248)'/><path d='${d}' fill='none' stroke='rgb(28,32,38)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>`)}")`;
  document.documentElement.style.setProperty('--handle', h('M25 19 16 28 25 37M31 19 40 28 31 37'));
}

/* ---------- The opening ---------- */
// Over the sky the circle fades in from nothing where it sits, Soren in it, the two doors under it (Merge, or Resume when a game
// you didn't lose waits, and Journey). Touch one and the circle expands out into the pool's edge. A tap anywhere brings it all in
// at once. With Reduce motion it is simply there.
function opening() {
  const len = TIME.long;   // the fade in
  hideCard(); closeSheet(); setPaused(false); S.outro = null; FR.path = []; FR.gear = false; FR.pick = null;
  S.intro = { t: lessMo() ? len : 0, len, go: null, rest: lessMo(), ready: lessMo(), quick: false };
  document.body.classList.add('intro'); BAR.ctx = ''; syncBars();
}
function introSkip() { const o = S.intro; if (o && o.go == null && o.t < o.len) { o.t = o.len; o.rest = o.ready = o.quick = true; syncBars(); } }   // a tap anywhere brings it all in at once
function introLeave(mode, zen = false) {   // out of the opening and into a mode; a new game lets the last one go
  introGo(); S.prev = null; S.goal = null; setMode(mode); setPaused(false); if (zen) Object.assign(S, { zen: true, fair: false }); syncUI();
}
function introGo() { if (S.intro && S.intro.go == null) { S.intro.go = S.intro.t; S.intro.rest = S.intro.ready = false; document.body.classList.remove('intro'); BAR.ctx = ''; syncBars(); } }
function doorTouch(b) {   // the two tiles at the door
  if (!S.intro || !S.intro.ready) return;
  if (b === 'journey') { journeyStart(); return; }
  if (b === 'free') { const p = S.prev; if (p) { introLeave('merge'); loadPool(p); } else introLeave('merge'); syncUI(); }
}
function start() {
  canvas = $('game'); ctx = canvas.getContext('2d'); S.lastInput = performance.now();
  handles(); bind(); newWorld(true); setupDPI();
  const prev = loadJSON(SKEY); S.prev = Array.isArray(prev.balls) && prev.balls.length && !prev.gameOver ? prev : null;   // every launch is a new game; one not lost waits at the door (Resume) until the first drop of a new one
  newPool(); PREFS.mode = 'merge'; S.tod = PREFS.hour === 'live' ? clockTod() : HOURS[PREFS.hour];
  updateScene(0); updateSky(); updateWind(0); updateWarmth(); syncUI(); fitPool();
  opening();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
let playFadeT = 0;
function playFade(on) {   // the tiles blend back while a finger is on the pool, and return a moment after it lifts
  clearTimeout(playFadeT); if (on) document.body.classList.add('playing'); else playFadeT = setTimeout(() => document.body.classList.remove('playing'), 2500);
}
</script>
