<script>

const LW = 380, LH = 490, DANGER_Y = 88, DROP_Y = 50;
// A wide range, like real marbles: the smallest is a pea beside the largest.
const RADII = [12, 17, 23, 30, 38, 47, 57, 68, 80, 93];
const VALUES = RADII.map((_, i) => 2 ** (i + 1));          // 2 … 1024; two 1024s bloom into 2048
const BLOOM_VALUE = 2048, WILD_R = 22;

const PHYS = { gravity: 0.40, air: 0.9985, rest: 0.14, roll: 0.994, friction: 0.22, wall: 0.3, floor: 0.12, sub: 8 };

function createWorld() { return { balls: [], nextId: 1 }; }
// How freely a sphere can move in direction (dx, dy): against the floor it can only slide sideways, against a wall only up or down.
function give(b, dx, dy) {
  let f = 1;

  if ((dx < 0 && b.x <= b.radius + 4.5) || (dx > 0 && b.x >= LW - b.radius - 4.5)) f = Math.min(f, dy * dy);
  return f;

function addBall(world, x, y, tier, o = {}) {
  const radius = o.wild ? WILD_R : RADII[tier], mass = radius * radius, inertia = 0.5 * mass * radius * radius;
  const b = { id: world.nextId++, x, y, vx: o.vx || 0, vy: o.vy || 0, radius, mass, invMass: 1 / mass, inertia, invInertia: 1 / inertia,
    tier, wild: !!o.wild, angle: o.angle || 0, omega: o.omega || 0, age: o.age || 0, merged: false, landed: !!o.landed };
  world.balls.push(b);
  return b;
}
// wind pushes falling spheres (per frame², for a sphere of radius 30; small ones drift more, within reason).
// Returns the merges (with the new sphere's id) and blooms, and whether anything touched down.
function stepWorld(world, wind) {
  const events = [], dt = 1 / PHYS.sub;
  let balls = world.balls, landed = false;
  const touchDown = (b) => { if (!b.landed) { b.landed = true; landed = true; } };
  for (let s = 0; s < PHYS.sub; s++) {
    const pairs = [];
    for (const b of balls) {
      b.vy += PHYS.gravity * dt;
      if (wind && !b.landed) b.vx += wind * (30 / Math.max(20, b.radius)) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.angle += b.omega * dt;
      const L = b.radius + 4, R = LW - b.radius - 4, F = LH - b.radius - 6;
      // Walls and floor grip: a marble sliding along one picks up spin and settles into a true roll.
      if (b.x < L) { b.x = L; if (b.vx < 0) b.vx = -b.vx * PHYS.wall; b.omega += ((b.vy - b.omega * b.radius) / b.radius) * 0.12 * dt; }
      else if (b.x > R) { b.x = R; if (b.vx > 0) b.vx = -b.vx * PHYS.wall; b.omega -= ((b.vy + b.omega * b.radius) / b.radius) * 0.12 * dt; }
      if (b.y > F) {
        b.y = F; if (b.vy > 0) b.vy = -b.vy * PHYS.floor;
        b.vx += ((2 * b.vx + b.omega * b.radius) / 3 - b.vx) * (0.35 * dt);
        b.vx *= Math.pow(PHYS.roll, dt); b.omega = b.vx / b.radius;

      }

    }
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        if (a.merged || b.merged) continue;
        const dx = b.x - a.x, dy = b.y - a.y, distSq = dx * dx + dy * dy, minDist = a.radius + b.radius;
        const canMerge = a.wild || b.wild || a.tier === b.tier;   // a Dewdrop merges with anything, another Dewdrop included
        if (canMerge && distSq < (minDist + 7) ** 2 && distSq > 0.001) {   // a pair that can merge draws together
          const d = Math.sqrt(distSq), pull = 0.22 * dt;

        }
        if (canMerge && distSq < (minDist + 1.2) ** 2) { a.merged = b.merged = true; pairs.push([a, b]); continue; }

        const totalInv = wa + wb;

        a.x -= nx * corr * (wa / totalInv); a.y -= ny * corr * (wa / totalInv);
        b.x += nx * corr * (wb / totalInv); b.y += ny * corr * (wb / totalInv);
        const rvx = (b.vx + b.omega * b.radius * ny) - (a.vx - a.omega * a.radius * ny);
        const rvy = (b.vy - b.omega * b.radius * nx) - (a.vy + a.omega * a.radius * nx);
        const vn = rvx * nx + rvy * ny;

        if (vn < 0) {   // hard knocks bounce a little; gentle contacts don't bounce at all
          jn = -(1 + (Math.abs(vn) > 1.2 ? PHYS.rest : 0)) * vn / totalInv;
          a.vx -= jn * nx * wa; a.vy -= jn * ny * wa; b.vx += jn * nx * wb; b.vy += jn * ny * wb;

        if (Math.abs(nx) < 0.035 && Math.abs(ny) > 0.99) { const top = a.y < b.y ? a : b, k = (top.id % 2 ? -1 : 1) * 0.04 * dt; top.vx += k; top.omega += k / top.radius; }

    // It stays free to slide along it, so a small sphere squeezed under a big one squirts out sideways like a real marble.
    for (const b of balls) {
      if (b.merged) continue;

    }

    if (pairs.length) {

      for (const [a, b] of pairs) {
        const base = a.wild ? b.tier : a.tier, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
        if (base >= RADII.length - 1) { events.push({ type: 'bloom', x, y }); continue; }

        const nb = addBall(world, x, y, tier, { vx: (a.vx * a.mass + b.vx * b.mass) / m, vy: (a.vy * a.mass + b.vy * b.mass) / m,
          omega: (a.omega + b.omega) * 0.4, angle: (a.angle + b.angle) / 2, landed: true, age: 46 });
        nb.hot = true;
        events.push({ type: 'merge', id: nb.id, tier, x, y });
      }
    }
  }
  for (const b of balls) { b.vx *= PHYS.air; b.vy *= PHYS.air; b.omega *= PHYS.air; b.age += 1; }
  return { events, landed };
}

/* ---------- Helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString();
const hex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);

const seeded = (s) => () => (s = (s * 16807) % 2147483647) / 2147483647;

const BIRD_HZ = [1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0];   // the same C major pentatonic, two octaves up

/* ---------- The palette law, then the places ---------- */

const FAQ = [
  ['What is the Journey?', 'The other world. A landing over the sky alone, with the mountain and six doors in the ribbon under the pool: the mountain (the Journey itself, where you are), then Pacer (a dot that fills and empties; breathe with it), Tinker (spheres to catch, save or let go), Conquer (name what you will do, play first, go, come back, check in), Rest (the night-time sound machine), Studio (the settings as toys; nothing is kept unless you touch Use this) and Labs (the next science, under the stars). Touch a door once to see what it is, again to go in. The lit door, or the mountain, brings you back to the landing. To go back to Merge: Pause › Journey › Merge, or touch the first word in the bar.'],
  ['What is the Pacer?', 'A dot at the centre fills the circle in five and a half seconds, green, then blue, then white, and empties again; the ring melts at the crest and comes back as it fills. A light goes round the pool’s edge once a breath. Breathe in as it fills, out as it empties. Its row sets the pace: Slow, Natural, Quick (5, 5.5 and 6 a minute, inside the range the studies used); the pool’s breath in Play follows it. With Chest on (Labs), lay the phone flat on your chest, hands off, and after fifteen seconds the dot follows your breath.'],
  ['What is Tinker?', 'Spheres come in sets of six, grow together, hold, shrink and go; a new six come somewhere else. Hold one and it is caught: it keeps its size and follows your finger. Drop it in Save It, the green tank, and it lives there, kept between visits; a smaller one dropped onto a bigger one is taken in. Let It Go is the circle in the tank: open while a set is grown, shut between sets; dropped in while open, it is gone for good. The + makes one of your own: name it or not, pick its glow, set it loose. A tap on any sphere is a soft tap on glass. Spheres are thoughts: keep the good ones, let the worries go. Nothing is scored.'],

  ['How do I play?', 'Touch the pool and slide to move the waiting sphere; let go to drop it. Two of a kind merge into the next size up, and the two largest make a Full Bloom.'],

  ['What is Comp?', 'Play with the calm taken off: Pause › Game › Compete (or touch the second word in the bar). A harder mode starts with your next game; an easier one applies at once. The line creeps down; the wind is real and restless. One sphere at a time carries a countdown: merge it in time and the line lifts or a tool is yours; miss it and the line sinks or a wave rolls in. Strike knocks a sphere down a size; Storm is a gust with a hurricane category. Storms, ice, rain and lightning come on their own, each announced in the bar with its countdown; when lightning heats a sphere red, touch it to cool it. Now and then two or three come at once. Rarely, a tree takes the power out: the pool browns out and the dropper malfunctions until it comes back. Glass knocked hard enough chips, cracks and shatters. No aim line, no Heritage. Touch COMPETITION in the bar to leave: nothing is lost.'],
  ['What do the colours mean?', 'A green check means on, or the one chosen in its row. The tile you are on is deeper glass. Blue is the way on. White is quiet, or off. Red erases. Gold means something special. Colour is never the only sign.'],
  ['How do I get around?', 'The bar above the pool: three words (Merge, the rules, the place), Pause, and the score (touch it for Statistics). Each word goes to its setting. Pause opens a strip over the pool: ▶ to play on, ↺ for a new game, then Journey (the doors), Game (the mode, Aim, Next, Numbers, and Access: Still, Soft View, Breathe, Haptics) and Sound (on or off, the volume, each sound on or off), and ? for this Help. What shapes how you play is behind Pause; what adds to play is under the pool. Under the pool: Weather at the left, the tools, Scene at the right. Touch Weather and its four take the tools’ place; touch one and its row is its switch, how strong it is (a slider, in percent), ✓ and ›. Scene holds the place, the hour and Live sky. Touch the end tile again and the tools come back. Every change applies at once.'],

  ['What is Soft View?', 'Pause › Game › Soft: no bursts, no banners, no lightning, a softer buzz, nothing bright above 4 kHz. Still is Reduce motion, and follows the phone. Breathe is the pool’s own breath, at the Pacer’s pace.'],
  ['What is Labs?', 'The Journey’s Labs door, in beta: the next science, each experiment a check under the stars. Look up: lift the phone toward the sky and the real stars overhead fill the pool; hold the light on the ringed star to draw a constellation. Chest: in the Pacer, lay the phone flat on your chest, hands off, and after fifteen seconds the dot follows your breath. Heavy: a big sphere follows your finger slowly, as heavy glass would. They read the phone’s own motion sensor, on the phone; nothing is kept or sent.'],
  ['What is Studio?', 'A door in the Journey: a sandbox. Scene and Weather as you know them, Sound as a full mixer (each sound’s level, in percent), Depth (how much of the scene is drawn: it steps on each touch), Fresh (every toy back to how SoRen came) and Use this (keeps what you made). Leave without it and nothing is kept.'],
  ['Why does it feel this way?', 'Real science, kept simple. The breath starts at five and a half a minute, near where breath and heartbeat fall into step for most people; the green line on Pace is the range the studies used. Glass rings long and wood stops short, because that is how each really sounds. Rain falls at its true speeds, thunder comes three seconds a kilometre after its flash so you can count it, and the sky is the real one: the sun, the moon with its phase, the planets in their colours and the stars stand where they stand right now over 41° north, worked out from the clock, not fetched. Lightning never flashes more than three times a second. Nature sound stays soft: quiet matters as much as the sound. None of it is treatment. It is somewhere to settle.'],
  ['What are the numbers?', 'Breath: 5.5 a minute, the mean where heart rate and breathing fall into step in the research; the green band on Pace is 4.8 to 6.6, the range the studies used. Light: never more than 3 flashes in a second, each flash one glow, never a flicker. Thunder: a rise of at least 50 ms, 3 seconds for every kilometre. Rain: each drop falls at the true speed for its size, and small drops outnumber large ones as they do in the sky. Sound: glass and wood ring for as long as glass and wood do; Tinker’s taps keep a dark timbre, under 1.5 kHz. Haptics: three strengths (0.5, 0.7, 1.0), the buzz first and the sound within 20 ms. Colour: the scene stays low in saturation and lighter than the frame around it; text is meant to be at least 7:1 against its background. The sky: the sun and planets to a tenth of a degree, the moon to a quarter (Meeus); the meteor showers on their nights, streaming from where their radiant stands. Every number is in the code, with its source.'],
  ['Is the sky real?', 'Yes. Where the sun and the moon stand, how much of the moon is lit and how big it looks, which planets and stars are up, which meteor shower is on tonight, and every eclipse are worked out on the phone from the date, the time and where you stand (41° north and your time zone until Live sky is on), the way an almanac does it. The window faces south and is as wide as that day’s arc: the sun’s by day, the moon’s by night. Nothing is sent anywhere.'],
  ['What is the moon doing?', () => { const s = skyAt(skyTime()), m = s.moon, n = moonNames(skyTime()), lit = Math.round(m.frac * 100), when = n.next.toLocaleDateString([], { month: 'long', day: 'numeric' });

  $('maker').addEventListener('submit', (e) => { e.preventDefault(); if (S.tk) tkMake(); });
  document.addEventListener('focusout', (e) => { const tx = e.target.closest && e.target.closest('[data-task]'); if (tx) cqLock(+tx.dataset.task); });   // the finger leaves a line with words in it: locked in gold
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && POP.alone) { closeSheet(); return; }   // the frame's own pop-up: Escape is Back
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-task]')) { e.preventDefault(); const i = +e.target.dataset.task; cqLock(i); const nx = $('jrText').children[i + 1]; if (nx) nx.focus(); else e.target.blur(); return; }
    if (CARD.name && e.key === 'Escape') footAct('close');
    if (e.key === 'Escape' && S.tk && !$('maker').hidden) tkMaker(false);
  });
  const flush = () => { savePrefs(); saveJournal(); savePool(); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { $('veil').classList.add('on'); S.hadDrone = !!sound.drone; sound.off(); S.awayAt = Date.now(); if (S.mode !== 'rest' && !S.intro) setPaused(true); flush(); return; }   // everything waits for a tap, your time too; the phone's snapshot is dark
    requestAnimationFrame(() => requestAnimationFrame(() => $('veil').classList.remove('on')));
    if (S.hadDrone) { sound.init(); if (sound.live) sound.startDrone(); }   // the engine was closed while away: the drone that was playing comes back with it
    updateWarmth(); syncBars(); if (S.mode === 'rest') requestWake(true);
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('resize', () => { setupDPI(); fitPool(); BAR.ctlKey = ''; BAR.rows = ''; syncBars(); inkApply(); if (CARD.name || POP.alone) fitCard(); });
}
function setupDPI() { const dpr = poolDPR(); canvas.width = Math.round(LW * dpr); canvas.height = Math.round(LH * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); makeSprites(); }
// The slider's handle: a blue ring round white, with ‹ ›.
function handles() {
  const h = (d) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><circle cx='28' cy='28' r='28' fill='rgb(${BLUE})'/><circle cx='28' cy='28' r='22' fill='rgb(246,247,248)'/><path d='${d}' fill='none' stroke='rgb(28,32,38)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>`)}")`;
  document.documentElement.style.setProperty('--handle', h('M25 19 16 28 25 37M31 19 40 28 31 37'));
}

/* ---------- The opening ---------- */
// Over the sky the circle fades in from nothing where it sits, Soren in it, the two doors under it (Merge, or Resume when a game
// you didn't lose waits, and Journey). Touch one and the circle expands out into the pool's edge. A tap anywhere brings it all in
// at once. With Reduce motion it is simply there.
function opening() {
  const len = TIME.long;   // the fade in
  hideCard(); closeSheet(); setPaused(false); S.outro = null; frClose();
  S.intro = { t: lessMo() ? len : 0, len, go: null, rest: lessMo(), ready: lessMo(), quick: false };
  document.body.classList.add('intro'); BAR.ctx = ''; syncBars();
}
function introSkip() { const o = S.intro; if (o && o.go == null && o.t < o.len) { o.t = o.len; o.rest = o.ready = o.quick = true; syncBars(); } }   // a tap anywhere brings it all in at once
function introLeave(mode, zen = false) {   // out of the opening and into a mode; a new game lets the last one go
  introGo(); S.prev = null; S.goal = null; setMode(mode); setPaused(false); if (zen) Object.assign(S, { zen: true, fair: false }); syncUI();
}
function introGo() { if (S.intro && S.intro.go == null) { S.intro.go = S.intro.t; S.intro.rest = S.intro.ready = false; document.body.classList.remove('intro'); BAR.ctx = ''; syncBars(); } }
function doorTouch(b) {   // the two tiles at the door
  if (!S.intro || !S.intro.ready) return;
  if (b === 'journey') { journeyStart(); return; }
  if (b === 'free') { const p = S.prev; if (p) { introLeave('merge'); loadPool(p); } else introLeave('merge'); syncUI(); }
}
function start() {
  canvas = $('game'); ctx = canvas.getContext('2d'); S.lastInput = performance.now();
  handles(); bind(); newWorld(true); setupDPI();
  const prev = loadJSON(SKEY); S.prev = Array.isArray(prev.balls) && prev.balls.length && !prev.gameOver ? prev : null;   // every launch is a new game; one not lost waits at the door (Resume) until the first drop of a new one
  newPool(); PREFS.mode = 'merge'; S.tod = PREFS.hour === 'live' ? clockTod() : HOURS[PREFS.hour];
  if (PREFS.live) liveStart();
  updateScene(0); updateSky(true); updateWind(0); updateWarmth(); syncUI(); fitPool();
  opening();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
let playFadeT = 0;
function playFade(on) {   // the tiles blend back while a finger is on the pool, and return a moment after it lifts
  clearTimeout(playFadeT); if (on) document.body.classList.add('playing'); else playFadeT = setTimeout(() => document.body.classList.remove('playing'), 2500);
}
</script>
