<script>

        events.push({ type: 'merge', id: nb.id, tier, x, y });

}

// The experiments, each off until you switch it on under the Lab's stars. They read the phone's own motion sensor, on the phone,
// and nothing is kept or sent. iPhones ask once, when you switch one on.

  if (S.mode === 'calm') closeCalm();
  if (S.mode === 'fidget') closeFidget();
  if (S.mode === 'studio') studioLeave();
  if (S.mode === 'rest') exitRest();
  S.mode = m; S.armed = false; setPaused(m === 'merge');   // back in Merge, the game waits for a tap
  if (m === 'rest') { S.rumbles = []; S.pulses = []; LT.tail = 0; closeSheet(); enterRest(); }   // nothing rumbles on into Rest
  if (m === 'calm') openCalm();

function pickNextTier() {

  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) { if (r < w[i]) return i; r -= w[i]; }
  return 0;

  ['What is Conquer?', 'Five steps in the pool. Name it: up to three lines of what you will do after, or none. How long first: 15, 30 or 60 minutes of Merge, or Free. Go: you play; a bell at three minutes left, two at one; or touch Go now. Then three breaths out, and the pool goes dark with your lines and a send-off. I’m back: your lines, to touch as done; one done is a gold done, a whole list is a surprise. What you did leaves the list; the rest waits for next time.'],

  ['What is Comp?', 'Play with the calm taken off, on the Game tile. The line creeps down; the wind is real and restless. One sphere at a time carries a countdown: merge it in time and the line lifts or a tool is yours; miss it and the line sinks or a wave rolls in. Strike knocks a sphere down a size; Storm is a gust with a hurricane category. Storms, ice, rain and lightning come on their own, each announced on the status bar with its countdown; when lightning heats a sphere red, touch it to cool it (the dropper waits meanwhile). Now and then two or three come at once: Double trouble, Triple threat. Rarely, a tree takes the power out: the pool browns out and the dropper malfunctions (it stutters, jams, drops too fast or drops two) until it comes back. Glass knocked hard enough chips, cracks and shatters. No aim line, no Heritage. Touch COMPETITION on the status bar to leave: nothing is lost. Comp is at Touch › Game.'],

  ['What are the modes?', 'Merge: the game, with three rule sets: Zen (nothing ends), Classic (the line ends it) and Comp (teeth). Calm: hold to breathe in, let go to breathe out, and a light to follow (the Journey’s Pacer door). Rest: the pool fades to dark while sound plays on. Phones stop sound when they lock, so Rest keeps the screen awake; plug in for long sessions. Touch › Mode to switch.'],
  ['What is Soft View?', 'See › Comfort › Soft View, or the heart at the door: no bursts, no banners, no lightning, a softer buzz, nothing bright above 4 kHz. Still is Reduce motion, and follows the phone. Breathe is the pool’s own breath.'],
  ['What is the Lab?', 'The Journey’s Lab door: the next science, each experiment off until you switch it on under the stars. Look up: lift the phone toward the sky and the real stars overhead fill the pool; hold the light on the ringed star to draw a constellation. Chest: in Calm, lay the phone flat on your chest, hands off, and after fifteen seconds the pool follows your breath. Heavy: a big sphere follows your finger slowly, as heavy glass would. They read the phone’s own motion sensor, on the phone; nothing is kept or sent.'],
  ['Why does it feel this way?', 'Real science, kept simple. Calm starts at five and a half breaths a minute, near where breath and heartbeat fall into step for most people; the green line on Pace is the range the studies used. Glass rings long and wood stops short, because that is how each really sounds. Rain falls at its true speeds, thunder comes three seconds a kilometre after its flash so you can count it, and the sky follows the real sun at 41° north. Lightning never flashes more than three times a second. Nature sound stays soft: quiet matters as much as the sound. None of it is treatment. It is somewhere to settle.'],

    if (S.calm) { if (S.calm.finger) calmTouch(null, false); return; }
    if (!S.aiming || (pointerId !== null && e.pointerId !== pointerId)) return;
    const p = logical(e.clientX, e.clientY), cancelled = S.aimCancelled || !p.inside;
    S.aiming = false; S.aimCancelled = false; pointerId = null;
    if (drop && !cancelled) dropCurrent();   // a quick tap drops it right where it is
  };
  canvas.addEventListener('pointerup', (e) => { playFade(false); finish(e, true); });
  canvas.addEventListener('pointercancel', (e) => { playFade(false); finish(e, false); });
  canvas.addEventListener('keydown', (e) => {
    if (S.intro || S.card || S.sheet) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (e.repeat) return; if (S.sigh) endSigh(); else if (S.jr && S.mode !== 'merge') return; else if (S.paused) setPaused(false); else if (!S.calm) dropCurrent(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); S.targetX = clamp(S.targetX + (e.key === 'ArrowLeft' ? -14 : 14), 10, LW - 10); }
  });
  const ACTS = {
    compmenu: () => { LINE.sub = 'comp'; syncBars(); }, compoff: () => { LINE.sub = null; setPref('comp', false); }, subcancel: () => { LINE.sub = null; syncBars(); }   // COMPETITION offers Leave Comp, with Cancel: nothing lost
  };
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!$('mcPop').hidden && t.closest('#mc')) {   // the pop-up answers first
      const p = t.closest('[data-pop]'); if (!p) return;
      $('mcPop').hidden = true;
      if (POP.alone) { POP.alone = false; $('mc').classList.remove('alone'); if (!CARD.name) $('mc').hidden = true; syncBars(); }   // the frame's pop-up stood alone: it goes with its answer
      if (p.dataset.pop === 'go') { const f = POP.go; POP.go = null; if (f) f(); }
      return;
    }
    const inCard = t.closest('#mc');
    if (inCard) {
      const f = t.closest('[data-foot]'); if (f) { footAct(f.dataset.foot, f); return; }
      const row = t.closest('[data-row]'), r = row && CARD.rows[+row.dataset.row]; if (r && r.kind === 'hub') r.go();   // Help: the answer opens in full
      return;
    }
    const fr = t.closest('[data-f]'); if (fr) { frameTouch(fr.dataset.f); return; }   // the frame: the ribbons, the bar, the door
    const act = t.closest('[data-act]'); if (act && ACTS[act.dataset.act]) { ACTS[act.dataset.act](act); return; }
  });
  document.addEventListener('input', (e) => {
    if (e.target.closest('#ctlBar') && e.target.matches('input[type=range]')) { frameSlide(e.target); return; }   // the frame's slider: the setting follows at once
    const tx = e.target.closest('[data-task]'); if (tx) cqTyped(+tx.dataset.task, tx.value);   // Conquer's lines: a letter is heard, the first time
  });
  document.addEventListener('focusout', (e) => { const tx = e.target.closest && e.target.closest('[data-task]'); if (tx) cqLock(+tx.dataset.task); });   // the finger leaves a line with words in it: locked in gold
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && POP.alone) { POP.alone = false; $('mcPop').hidden = true; $('mc').classList.remove('alone'); if (!CARD.name) $('mc').hidden = true; syncBars(); return; }   // the frame's own pop-up: Escape is Back
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-task]')) { e.preventDefault(); const i = +e.target.dataset.task; cqLock(i); const nx = $('jrText').children[i + 1]; if (nx) nx.focus(); else e.target.blur(); return; }
    if (CARD.name && e.key === 'Escape') footAct('close');
  });
  const flush = () => { savePrefs(); saveJournal(); savePool(); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { $('veil').classList.add('on'); S.hadDrone = !!sound.drone; sound.off(); S.awayAt = Date.now(); if (S.mode !== 'rest' && !S.intro) setPaused(true); flush(); return; }   // everything waits for a tap, your time too; the phone's snapshot is dark
    requestAnimationFrame(() => requestAnimationFrame(() => $('veil').classList.remove('on')));
    if (S.hadDrone) { sound.init(); if (sound.live) sound.startDrone(); }   // the engine was closed while away: the drone that was playing comes back with it
    updateWarmth(); syncBars(); if (S.mode === 'rest') requestWake(true);
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('resize', () => { setupDPI(); fitPool(); BAR.ctlKey = ''; syncBars(); if (CARD.name || POP.alone) fitCard(); });
}
function setupDPI() { const dpr = poolDPR(); canvas.width = Math.round(LW * dpr); canvas.height = Math.round(LH * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); makeSprites(); }
// The slider's handle: a blue ring round white, with ‹ ›.
function handles() {
  const h = (d) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><circle cx='28' cy='28' r='28' fill='rgb(${BLUE})'/><circle cx='28' cy='28' r='22' fill='rgb(246,247,248)'/><path d='${d}' fill='none' stroke='rgb(28,32,38)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>`)}")`;
  document.documentElement.style.setProperty('--handle', h('M25 19 16 28 25 37M31 19 40 28 31 37'));
}

/* ---------- The opening ---------- */
// On dark blue, the breath's own shape heaves in, flashes once, and falls to the circle with SoRen in it, which goes on
// breathing: three breaths, then Start. A tap anywhere finishes the movement at once. With Reduce motion it is simply there.
function opening() {
  const len = 5.2;   // from the outline's first light to the circle at rest
  hideCard(); closeSheet(); setPaused(false); S.outro = null;
  S.intro = { t: lessMo() ? len + 3 : 0, len, go: null, rest: lessMo(), ready: lessMo(), eng: null, quick: false };
  document.body.classList.add('intro'); syncBars();
}
function introSkip() { const o = S.intro; if (o && o.go == null && o.t < o.len + 3) { o.t = o.len + 3; o.rest = o.ready = o.quick = true; syncBars(); } }   // a tap anywhere brings it all in at once
function introLeave(mode, zen = false) {   // out of the opening and into a mode; a new game lets the last one go
  introGo(); S.prev = null; S.goal = null; setMode(mode); setPaused(false); if (zen) Object.assign(S, { zen: true, fair: false }); syncUI();
}
function introGo() { if (S.intro && S.intro.go == null) { S.intro.go = S.intro.t; S.intro.rest = S.intro.ready = false; document.body.classList.remove('intro', 'intro-two'); DOOR.key = ''; syncBars(); } }
function start() {
  canvas = $('game'); ctx = canvas.getContext('2d'); S.lastInput = performance.now();
  handles(); applyLook(); bind(); newWorld(true); setupDPI();
  const prev = loadJSON(SKEY); S.prev = Array.isArray(prev.balls) && prev.balls.length && !prev.gameOver ? prev : null;   // every launch is a new game; one not lost waits at the door (Resume) until the first drop of a new one
  newPool(); PREFS.mode = 'merge'; S.tod = PREFS.hour === 'live' ? clockTod() : HOURS[PREFS.hour];
  updateScene(0); updateWind(0); updateWarmth(); syncUI(); fitPool();
  opening();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
let playFadeT = 0;
function playFade(on) {   // the trays blend back while a finger is on the pool, and return a second after it lifts
  clearTimeout(playFadeT); if (on) document.body.classList.add('playing'); else playFadeT = setTimeout(() => document.body.classList.remove('playing'), 2500);
}
</script>
