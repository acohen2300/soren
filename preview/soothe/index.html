<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SoRen · Soothe demo</title>
<style>
:root { --u: calc(min(100vw, 460px) / 1206); --ink: rgb(240, 240, 234); --dim: rgb(182, 188, 202); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #141a2e; color: var(--ink); font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#sky { position: fixed; inset: 0; transition: filter 3s ease; }
.app { position: relative; height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(20 * var(--u)) calc(20 * var(--u)) max(calc(20 * var(--u)), env(safe-area-inset-bottom)); }
.panel { background: rgba(22, 30, 54, 0.8); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: calc(68 * var(--u)); padding: calc(14 * var(--u)); }
.line { height: calc(84 * var(--u)); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(24 * var(--u)); font-size: calc(40 * var(--u)); font-style: italic; font-weight: 700; }
.line .v { font-style: normal; font-weight: 400; color: var(--dim); }
#pool { position: relative; flex: 1; min-height: 0; border-radius: calc(90 * var(--u)); overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.row { display: flex; gap: calc(16 * var(--u)); height: calc(120 * var(--u)); }
.cell { flex: 1; position: relative; border: 0; background: none; color: var(--ink); border-radius: calc(44 * var(--u)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); font: inherit; font-size: calc(36 * var(--u)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(6 * var(--u)); cursor: pointer; transition: transform 0.2s; }
.cell:active { transform: scale(0.97); }
.cell svg { width: calc(60 * var(--u)); height: calc(60 * var(--u)); fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cell.sel { background: rgba(36, 62, 150, 0.5); box-shadow: inset 0 0 0 1.5px rgba(150, 185, 255, 0.75); }
.hint { position: absolute; left: 50%; top: calc(36 * var(--u)); transform: translateX(-50%); font-size: calc(36 * var(--u)); color: var(--dim); background: rgba(14, 18, 34, 0.55); padding: calc(10 * var(--u)) calc(26 * var(--u)); border-radius: 99px; white-space: nowrap; pointer-events: none; transition: opacity 1.2s; }
.start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 14, 28, 0.35); }
.start button { font: inherit; font-size: calc(44 * var(--u)); color: var(--ink); background: rgba(22, 30, 54, 0.8); border: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4); border-radius: 99px; padding: calc(24 * var(--u)) calc(56 * var(--u)); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="app">
  <div class="panel"><div class="line"><span id="where">Soothing · Touch</span><span class="v" id="pace"></span></div></div>
  <div id="pool"><canvas id="c"></canvas><div class="hint" id="hint"></div><div class="start" id="start"><button>Touch to begin</button></div></div>
  <div class="panel"><nav class="row" id="steps">
    <button class="cell sel" data-s="touch"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="4"/><circle cx="16.5" cy="15" r="3"/></svg>Touch</button>
    <button class="cell" data-s="watch"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><circle cx="18" cy="8" r="1.6" fill="currentColor"/></svg>Watch</button>
    <button class="cell" data-s="breathe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>Breathe</button>
  </nav></div>
</div>
<script>
'use strict';
// GGSD: one rhythm for everything. In for 40% of a breath (grow, glow), out for 60% (slim, dim). A glow at the crest.
// The pace starts near 8 a minute and settles toward 5.5 as you stay; it never jumps.
const IN = 0.4, HINTS = { touch: 'Tap · hold to catch · drop small into big', watch: 'Follow the light', breathe: 'In as it grows · out as it fades' };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const smooth = (t) => t * t * (3 - 2 * t), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const R = { phase: 0, bpm: 8, t: 0 };
const level = () => (R.phase < IN ? smooth(R.phase / IN) : 1 - smooth((R.phase - IN) / (1 - IN)));
const crest = () => { const d = R.phase - IN; return Math.exp(-(d * d) / 0.0016); };   // a short bloom right at the top of the in-breath
let step = 'touch', W = 0, H = 0, dpr = 1;
const cv = document.getElementById('c'), cx = cv.getContext('2d'), sky = document.getElementById('sky'), sx = sky.getContext('2d');
function size() {
  dpr = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sky.width = innerWidth * dpr; sky.height = innerHeight * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0); drawSky();
}
function drawSky() {
  const g = sx.createLinearGradient(0, 0, 0, innerHeight);
  g.addColorStop(0, '#1b2140'); g.addColorStop(0.45, '#4a3f66'); g.addColorStop(0.8, '#9c7383'); g.addColorStop(1, '#c9a48f');
  sx.fillStyle = g; sx.fillRect(0, 0, innerWidth, innerHeight);
}
// ---------- Sound: soft, close, low; made by your own touch. No voice, no rustle; quick repeats soften instead of stacking.
const A = { ctx: null, out: null, pad: null, padG: null, last: 0 };
const SCALE = [0, 2, 4, 7, 9];   // pentatonic: nothing can clash
function noteFor(r) {   // bigger is lower; the scale keeps every pair consonant
  const k = clamp(1 - (r - 14) / 46, 0, 1), i = Math.round(k * 9);
  return 98 * Math.pow(2, (Math.floor(i / 5) * 12 + SCALE[i % 5]) / 12);   // from G2 up, biased low
}
function audio() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  A.ctx = new C(); A.out = A.ctx.createGain(); A.out.gain.value = 0.8;
  const lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; A.out.connect(lp); lp.connect(A.ctx.destination);
  A.padG = A.ctx.createGain(); A.padG.gain.value = 0; A.padG.connect(A.out);
  for (const f of [73.4, 110, 146.8]) { const o = A.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = A.ctx.createGain(); g.gain.value = f < 100 ? 0.5 : 0.18; o.connect(g); g.connect(A.padG); o.start(); }
}
function voice(freq, x, dur, kind) {
  if (!A.ctx) return; const t = A.ctx.currentTime, gap = t - A.last; A.last = t;
  const soft = gap < 0.25 ? 0.35 : 1;   // a quick second tap is quieter, never louder
  const p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null; if (p) p.pan.value = clamp((x / W) * 2 - 1, -0.7, 0.7) * 0.8;
  const g = A.ctx.createGain(); g.connect(p || A.out); if (p) p.connect(A.out);
  if (kind === 'clink') {   // glass: a low fundamental and a quiet bright partial, both short
    for (const [m, a] of [[1, 0.22], [2.76, 0.05], [5.4, 0.018]]) { const o = A.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * m; const e = A.ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(a * soft, t + 0.006); e.gain.exponentialRampToValueAtTime(0.0001, t + dur / m); o.connect(e); e.connect(g); o.start(t); o.stop(t + dur + 0.05); }
  } else if (kind === 'catch') {   // a soft low touch
    const o = A.ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq / 2; const e = A.ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.12 * soft, t + 0.03); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(e); e.connect(g); o.start(t); o.stop(t + 0.6);
  } else {   // the swallow: a low water gloop that settles into the big one's warm tone
    const o = A.ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq * 2.2, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.18);
    const e = A.ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.28, t + 0.02); e.gain.exponentialRampToValueAtTime(0.0001, t + 2.2); o.connect(e); e.connect(g); o.start(t); o.stop(t + 2.3);
    const o2 = A.ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 1.5; const e2 = A.ctx.createGain(); e2.gain.setValueAtTime(0, t + 0.15); e2.gain.linearRampToValueAtTime(0.08, t + 0.4); e2.gain.exponentialRampToValueAtTime(0.0001, t + 2.6); o2.connect(e2); e2.connect(g); o2.start(t); o2.stop(t + 2.7);
  }
}
// ---------- Touch: glass marbles that breathe, drift, ring, get caught, and swallow the small ones
const GLASS = [['168,206,232', '58,96,140'], ['190,222,200', '62,112,92'], ['226,206,176', '128,92,62'], ['206,196,230', '92,78,140'], ['230,214,222', '132,90,108']];
const balls = []; let held = null, press = null, born = 0;
function addBall(fresh) {
  const r = lerp(16, 56, Math.random() ** 1.3), m = 70;
  balls.push({ x: m + Math.random() * (W - 2 * m), y: m + Math.random() * (H - 2 * m), r, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, off: (Math.random() - 0.5) * 0.12, g: GLASS[Math.floor(Math.random() * GLASS.length)], fade: fresh ? 0 : 1, gone: 0, ring: 0 });
}
const sizeOf = (b) => b.r * (0.86 + 0.24 * lvlAt(b.off)) * (1 - b.gone);
function lvlAt(off) { const ph = (R.phase + off + 1) % 1; return ph < IN ? smooth(ph / IN) : 1 - smooth((ph - IN) / (1 - IN)); }
function marble(x, y, r, g, glow, a = 1) {
  if (r < 0.5) return; cx.save(); cx.globalAlpha = a;
  if (glow > 0.02) { const h = cx.createRadialGradient(x, y, r * 0.8, x, y, r * 2.2); h.addColorStop(0, `rgba(${g[0]},${0.45 * glow})`); h.addColorStop(1, `rgba(${g[0]},0)`); cx.fillStyle = h; cx.beginPath(); cx.arc(x, y, r * 2.2, 0, 7); cx.fill(); }
  // clear glass: you see through the middle; the colour gathers at the edge (where light travels through more glass)
  const b = cx.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.05, x, y, r);
  b.addColorStop(0, `rgba(${g[0]},0.10)`); b.addColorStop(0.65, `rgba(${g[0]},0.22)`); b.addColorStop(0.9, `rgba(${g[1]},0.55)`); b.addColorStop(1, `rgba(${g[1]},0.75)`);
  cx.fillStyle = b; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
  cx.strokeStyle = `rgba(255,255,255,${0.55 + 0.3 * glow})`; cx.lineWidth = 1.6; cx.beginPath(); cx.arc(x, y, r - 0.8, 0, 7); cx.stroke();   // the outline: the bright rim of the glass
  cx.strokeStyle = `rgba(${g[0]},0.35)`; cx.lineWidth = 1; cx.beginPath(); cx.arc(x, y, r * 0.86, Math.PI * 0.15, Math.PI * 0.85); cx.stroke();   // light bent round the inside, low on the far side
  cx.fillStyle = `rgba(255,255,255,${0.65 + 0.3 * glow})`; cx.beginPath(); cx.ellipse(x - r * 0.4, y - r * 0.46, r * 0.2, r * 0.1, -0.6, 0, 7); cx.fill();   // the window highlight
  cx.fillStyle = 'rgba(255,255,255,0.4)'; cx.beginPath(); cx.arc(x - r * 0.12, y - r * 0.62, r * 0.045, 0, 7); cx.fill();   // a second, small catch-light
  const c = cx.createRadialGradient(x + r * 0.3, y + r * 0.45, 0, x + r * 0.3, y + r * 0.45, r * 0.38); c.addColorStop(0, `rgba(${g[0]},0.35)`); c.addColorStop(1, `rgba(${g[0]},0)`);
  cx.fillStyle = c; cx.beginPath(); cx.arc(x + r * 0.3, y + r * 0.45, r * 0.38, 0, 7); cx.fill();   // the light it focuses, on its far side
  cx.restore();
}
function touchStep(dt) {
  for (const b of balls) {
    b.fade = Math.min(1, b.fade + dt / 2); b.ring = Math.max(0, b.ring - dt * 1.5);
    if (b === held) continue;
    if (!still) { b.x += b.vx * dt; b.y += b.vy * dt; }
    const r = sizeOf(b); if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx); } if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx); } if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy); } if (b.y > H - r) { b.y = H - r; b.vy = -Math.abs(b.vy); }
    if (b.into) { b.gone = Math.min(1, b.gone + dt * 1.6); b.x = lerp(b.x, b.into.x, 0.12); b.y = lerp(b.y, b.into.y, 0.12); }
  }
  for (let i = balls.length - 1; i >= 0; i--) if (balls[i].gone >= 1) { balls.splice(i, 1); born = R.t + 4; }
  if (balls.length < 8 && born && R.t > born && R.phase < 0.05) { addBall(true); born = balls.length < 8 ? R.t + 3 : 0; }   // a new one arrives on an in-breath, on its own
}
function drawTouch() {
  const top = balls.slice().sort((a, b) => b.r - a.r);   // big ones behind
  for (const b of top) { const r = sizeOf(b), gl = 0.25 * lvlAt(b.off) + 0.9 * crest() + b.ring; marble(b.x, b.y, r, b.g, Math.min(1.2, gl), b.fade); }
  if (held) { const r = sizeOf(held); cx.strokeStyle = 'rgba(255,255,255,0.5)'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(held.x, held.y, r + 8, 0, 7); cx.stroke(); }
}
// ---------- Watch: a solid glowing marble, round the edge clockwise, one lap a breath, its tail fading behind
const trail = [];
function edgeAt(u) {   // a rounded rectangle inset from the pool's edge, u from 0 to 1, clockwise from the top middle
  const m = 34, w = W - 2 * m, h = H - 2 * m, rr = Math.min(70, w / 3), straight = [w - 2 * rr, h - 2 * rr], arc = Math.PI * rr / 2;
  const L = 2 * straight[0] + 2 * straight[1] + 4 * arc; let d = ((u % 1) + 1) % 1 * L;
  const segs = [['l', m + rr + straight[0] / 2, m, straight[0] / 2, 0], ['a', m + w - rr, m + rr, -Math.PI / 2], ['l', m + w, m + rr, straight[1], 1], ['a', m + w - rr, m + h - rr, 0], ['l', m + w - rr, m + h, straight[0], 2], ['a', m + rr, m + h - rr, Math.PI / 2], ['l', m, m + h - rr, straight[1], 3], ['a', m + rr, m + rr, Math.PI], ['l', m + rr, m, straight[0] / 2, 0]];
  for (const s of segs) {
    if (s[0] === 'l') { if (d <= s[3]) { const dir = s[4]; return dir === 0 ? [s[1] + d, s[2]] : dir === 1 ? [s[1], s[2] + d] : dir === 2 ? [s[1] - d, s[2]] : [s[1], s[2] - d]; } d -= s[3]; }
    else { if (d <= arc) { const a = s[3] + d / rr; return [s[1] + rr * Math.cos(a), s[2] + rr * Math.sin(a)]; } d -= arc; }
  }
  return [m + rr, m];
}
let lap = 0;
function drawWatch(dt) {
  lap += dt / (60 / R.bpm); const [x, y] = edgeAt(lap); trail.push([x, y]); while (trail.length > 70) trail.shift();
  cx.strokeStyle = 'rgba(255,255,255,0.06)'; cx.lineWidth = 2; cx.beginPath(); for (let i = 0; i <= 120; i++) { const p = edgeAt(i / 120); i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]); } cx.stroke();   // the groove it runs in
  for (let i = 0; i < trail.length; i++) { const k = i / trail.length; cx.fillStyle = `rgba(255,236,200,${0.28 * k * k})`; cx.beginPath(); cx.arc(trail[i][0], trail[i][1], 3 + 9 * k, 0, 7); cx.fill(); }
  const lv = level(), r = 13 + 5 * lv; marble(x, y, r, ['255,244,220', '232,184,120'], 0.4 + 0.5 * lv + 0.9 * crest());
}
// ---------- Breathe: one circle; the world goes quiet
function drawBreathe() {
  const lv = level(), r = lerp(Math.min(W, H) * 0.14, Math.min(W, H) * 0.34, lv), x = W / 2, y = H / 2;
  const g = cx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.6); g.addColorStop(0, `rgba(196,226,214,${0.10 + 0.18 * lv + 0.2 * crest()})`); g.addColorStop(1, 'rgba(196,226,214,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 1.6, 0, 7); cx.fill();
  cx.strokeStyle = `rgba(232,242,236,${0.55 + 0.35 * lv})`; cx.lineWidth = 2 + 1.5 * lv; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.stroke();
  cx.fillStyle = `rgba(240,240,234,${0.75})`; cx.font = `italic 600 ${Math.round(r * 0.28 + 8)}px -apple-system, system-ui, sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(R.phase < IN ? 'in' : 'out', x, y);
}
// ---------- The loop
let lastT = performance.now(), begun = false;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; R.t += dt;
  const target = step === 'touch' ? 7 : step === 'watch' ? 6.2 : 5.5; R.bpm += (target - R.bpm) * Math.min(1, dt / 40) + (R.bpm > 5.5 ? -dt / 240 : 0);   // settles slowly, never jumps
  R.bpm = clamp(R.bpm, 5.5, 8); R.phase = (R.phase + dt / (60 / R.bpm)) % 1;
  if (A.padG) { const quiet = step === 'breathe' ? 0.5 : 1; A.padG.gain.setTargetAtTime((0.05 + 0.07 * level()) * quiet, A.ctx.currentTime, 0.4); }
  document.getElementById('pace').textContent = `${R.bpm.toFixed(1)} a minute`;
  cx.clearRect(0, 0, W, H);
  const pg = cx.createLinearGradient(0, 0, 0, H); pg.addColorStop(0, 'rgba(18,24,46,0.55)'); pg.addColorStop(1, 'rgba(30,26,52,0.7)'); cx.fillStyle = pg; cx.fillRect(0, 0, W, H);   // the pool: a darker pane of the same sky
  if (step === 'touch') { touchStep(dt); drawTouch(); } else if (step === 'watch') drawWatch(dt); else drawBreathe();
  sky.style.filter = step === 'breathe' ? 'brightness(0.7) saturate(0.7)' : 'none';
  requestAnimationFrame(frame);
}
// ---------- Touch input: tap rings it; hold catches it; drop a small one on a bigger one and it is swallowed
const hit = (x, y) => { let best = null; for (const b of balls) { const d = Math.hypot(b.x - x, b.y - y), r = sizeOf(b) + 10; if (d < r && !b.into && (!best || b.r < best.r)) best = b; } return best; };
const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', (e) => {
  if (!begun || step !== 'touch') return; audio(); const [x, y] = pt(e), b = hit(x, y); if (!b) return;
  press = { b, x, y, t: performance.now(), dx: b.x - x, dy: b.y - y }; cv.setPointerCapture(e.pointerId);
  press.timer = setTimeout(() => { if (press) { held = press.b; held.vx = held.vy = 0; voice(noteFor(held.r), held.x, 0, 'catch'); if (navigator.vibrate) navigator.vibrate(8); } }, 220);
});
cv.addEventListener('pointermove', (e) => { if (!held || !press) return; const [x, y] = pt(e); held.x = clamp(x + press.dx, 0, W); held.y = clamp(y + press.dy, 0, H); });
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
function end() {
  if (!press) return; clearTimeout(press.timer);
  if (!held) { const b = press.b; b.ring = 0.8; voice(noteFor(b.r), b.x, 1.8, 'clink'); }
  else { const big = balls.filter(o => o !== held && !o.into && o.r > held.r && Math.hypot(o.x - held.x, o.y - held.y) < sizeOf(o)).sort((a, b) => b.r - a.r)[0];
    if (big) { held.into = big; big.ring = 1.2; voice(noteFor(big.r), big.x, 0, 'gloop'); } else { held.vx = (Math.random() - 0.5) * 6; held.vy = (Math.random() - 0.5) * 6; } }
  held = null; press = null;
}
// ---------- The steps
function go(s) {
  step = s; for (const b of document.querySelectorAll('#steps .cell')) b.classList.toggle('sel', b.dataset.s === s);
  document.getElementById('where').textContent = `Soothing · ${s[0].toUpperCase() + s.slice(1)}`;
  const h = document.getElementById('hint'); h.textContent = HINTS[s]; h.style.opacity = 1; clearTimeout(go.t); go.t = setTimeout(() => (h.style.opacity = 0), 5000);
}
document.getElementById('steps').addEventListener('click', (e) => { const b = e.target.closest('.cell'); if (b) { audio(); go(b.dataset.s); } });
document.getElementById('start').addEventListener('click', () => { audio(); begun = true; document.getElementById('start').remove(); go('touch'); });
addEventListener('resize', size);
size(); for (let i = 0; i < 7; i++) addBall(false); requestAnimationFrame(frame);
</script>
</body>
</html>
